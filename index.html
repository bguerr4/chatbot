<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat de Classificação — Teste</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f2f2f2;
    display: flex;
    justify-content: center;
    padding: 24px;
  }
  .app {
    width: 100%;
    max-width: 640px;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    display: flex;
    flex-direction: column;
    height: 90vh;
    overflow: hidden;
  }
  .header {
    padding: 14px 18px;
    border-bottom: 1px solid #e5e5e5;
    font-size: 15px;
    font-weight: 600;
  }
  .config {
    padding: 10px 18px;
    border-bottom: 1px solid #e5e5e5;
    display: flex;
    gap: 8px;
  }
  .config input {
    flex: 1;
    padding: 8px 10px;
    border: 1px solid #ddd;
    border-radius: 6px;
    font-size: 12px;
  }
  .chat {
    flex: 1;
    overflow-y: auto;
    padding: 16px 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg {
    max-width: 85%;
    padding: 10px 12px;
    border-radius: 10px;
    font-size: 14px;
    line-height: 1.4;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: #2563eb;
    color: white;
  }
  .msg.bot {
    align-self: flex-start;
    background: #f0f0f0;
    color: #111;
    font-family: "SFMono-Regular", Consolas, Menlo, monospace;
    font-size: 12.5px;
  }
  .msg.bot.error {
    background: #fde8e8;
    color: #a10000;
  }
  .msg.thinking {
    align-self: flex-start;
    background: #f0f0f0;
    color: #888;
    font-style: italic;
  }
  .inputbar {
    border-top: 1px solid #e5e5e5;
    padding: 12px;
    display: flex;
    gap: 8px;
  }
  .inputbar textarea {
    flex: 1;
    resize: none;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 10px;
    font-size: 14px;
    font-family: inherit;
    height: 44px;
  }
  .inputbar button {
    padding: 0 18px;
    border: none;
    border-radius: 8px;
    background: #2563eb;
    color: white;
    font-size: 14px;
    cursor: pointer;
  }
  .inputbar button:disabled {
    background: #aac0f0;
    cursor: not-allowed;
  }
</style>
</head>
<body>

<div class="app">
  <div class="header">Chat de Classificação — ambiente de teste</div>

  <div class="config">
    <input id="apiKey" type="password" placeholder="Cole aqui sua API key do OpenRouter (sk-or-...)">
  </div>

  <div class="chat" id="chat"></div>

  <div class="inputbar">
    <textarea id="input" placeholder="Digite a mensagem do usuário..."></textarea>
    <button id="sendBtn" onclick="enviarMensagem()">Enviar</button>
  </div>
</div>

<script>
const SYSTEM_PROMPT = `Você é um classificador de mensagens recebidas por uma empresa.

Sua única função é analisar a mensagem do usuário e retornar uma classificação. Você NUNCA responde à mensagem do usuário como um assistente comum, nunca dá conselhos, nunca conversa. Você apenas classifica.

Para cada mensagem recebida, produza:
1. "contexto": um resumo curto e objetivo do que a mensagem está tratando.
2. "setor_responsavel": qual setor da empresa deveria tratar essa mensagem. Escolha um entre: "Suporte", "Financeiro", "Vendas", "RH", "Jurídico", "Outro".
3. "acao_recomendada": a ação principal e mais concreta que o setor responsável deveria tomar a seguir.

Regras rígidas:
- Responda SEMPRE e SOMENTE com um objeto JSON válido, sem nenhum texto antes ou depois, sem markdown, sem crases, sem explicações.
- O JSON deve conter exatamente as chaves: contexto, setor_responsavel, acao_recomendada.
- Nunca invente informação que não esteja implícita na mensagem.
- Se a mensagem for ambígua ou não fizer sentido, ainda assim retorne o JSON, usando "Outro" como setor e explicando a ambiguidade no campo contexto.`;

const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const apiKeyEl = document.getElementById('apiKey');

function addMessage(text, className) {
  const div = document.createElement('div');
  div.className = 'msg ' + className;
  div.textContent = text;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div;
}

async function enviarMensagem() {
  const mensagem = inputEl.value.trim();
  const apiKey = apiKeyEl.value.trim();

  if (!mensagem) return;
  if (!apiKey) {
    addMessage('Cole sua API key do OpenRouter no campo acima antes de enviar.', 'bot error');
    return;
  }

  addMessage(mensagem, 'user');
  inputEl.value = '';
  sendBtn.disabled = true;

  const thinkingEl = addMessage('classificando...', 'thinking');

  try {
    const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer ' + apiKey,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        model: 'openrouter/free',
        messages: [
          { role: 'system', content: SYSTEM_PROMPT },
          { role: 'user', content: mensagem }
        ],
        temperature: 0.2
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error?.message || 'Erro na chamada da API');
    }

    let raw = data.choices?.[0]?.message?.content?.trim() || '';

    // remove possíveis blocos de código, caso o modelo insista em usar markdown
    raw = raw.replace(/^```json\s*/i, '').replace(/^```\s*/i, '').replace(/```$/i, '').trim();

    let parsed;
    try {
      parsed = JSON.parse(raw);
    } catch (e) {
      thinkingEl.remove();
      addMessage('O modelo não retornou um JSON válido:\n\n' + raw, 'bot error');
      return;
    }

    thinkingEl.remove();
    addMessage(JSON.stringify(parsed, null, 2), 'bot');

  } catch (err) {
    thinkingEl.remove();
    addMessage('Erro: ' + err.message, 'bot error');
  } finally {
    sendBtn.disabled = false;
  }
}

inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    enviarMensagem();
  }
});
</script>

</body>
</html>
